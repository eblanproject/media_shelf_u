name: CI

on:
  push:
    branches: [main, frontend]
  pull_request:
    branches: [main, frontend]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Проверка кода — на каждый push и pull request
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  # Деплой делает Vercel сам (интеграция с GitHub), здесь только проверка кода
