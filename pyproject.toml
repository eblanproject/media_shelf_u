[project]
name = "media-shelf-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "requests",
    "python-dotenv",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyjwt",
    "pwdlib[argon2]",
    "email-validator",
]

[tool.vercel]
entrypoint = "app.main:app"
